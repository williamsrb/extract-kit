_comment:
  - Enonic XP7 adapter. Extends core and binds static inventory, integrations, CMS.
  - Runtime CMS is local/review only. Guillotine URL is a run parameter.
  - Production hosts are refused unless --allow-production (not used in the DoD).
name: enonic
extends: core
adapters:
  map.code: map.code
  map.semantic: map.semantic
  inventory.descriptors: enonic.descriptors
  inventory.controllers: enonic.controllers
  inventory.templates: core.templates
  maps.normalize: maps.normalize
  inventory.integrations: enonic.integrations
  inventory.runtime: enonic.cms
  inventory.baseline: enonic.baseline
  maps.merge: maps.merge
  rules.view: core.view_rules
  inventory.docs: enonic.docs
  product.impeccable: product.impeccable
  docs.synthesize: docs.synthesize
  use_cases: use_cases
  domain.packet: enonic.domain_packet
  spec.kit: spec.kit
  report.compat: enonic.compat
cms:
  host: http://localhost:8080
  project: en
  site_key: /en
  keys:
    - /en
  sample_per_type: 3
round2: []
deps:
  - provides: [playwright-cli]
    optional: true
