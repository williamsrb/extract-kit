_comment:
  - Core pipeline. Stack adapters stay unbound; enonic.yaml fills them.
  - map.code / map.semantic skip with a named fix when the source has no index.
name: core
extends: null
todo: []
deps:
  - provides: [python3]
    apt: python3
    dnf: python3
    pacman: python
pipeline:
  - map.code
  - map.semantic
  - inventory.descriptors
  - inventory.controllers
  - maps.normalize
  - inventory.integrations
  - inventory.runtime
  - inventory.baseline
  - maps.merge
  - inventory.docs
  - product.impeccable
  - docs.synthesize
  - use_cases
  - spec.kit
  - report.compat
optional_slots:
  - inventory.baseline
  - report.compat
phases:
  - id: preflight
    title: Preflight
    command: doctor
  - id: static
    title: Static inventory
    slots: [map.code, map.semantic, inventory.descriptors, inventory.controllers, maps.normalize, inventory.integrations]
  - id: cms
    title: CMS
    slots: [inventory.runtime, inventory.baseline]
  - id: merge
    title: Merge
    slots: [maps.merge, inventory.docs]
  - id: synthesis
    title: Synthesis
    slots: [product.impeccable, docs.synthesize, use_cases, spec.kit, report.compat]
  - id: check
    title: Check
    command: check
  - id: promote
    title: Promote
    command: promote
adapters:
  map.code: map.code
  map.semantic: map.semantic
  inventory.descriptors: null
  inventory.controllers: null
  maps.normalize: maps.normalize
  inventory.integrations: null
  inventory.runtime: null
  inventory.baseline: null
  maps.merge: maps.merge
  inventory.docs: null
  product.impeccable: product.impeccable
  docs.synthesize: docs.synthesize
  use_cases: use_cases
  spec.kit: spec.kit
  report.compat: null
