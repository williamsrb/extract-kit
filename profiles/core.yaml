_comment:
  - Core pipeline. Stack adapters stay unbound; enonic.yaml fills them.
  - map.code / map.semantic skip with a named fix when the source has no index.
name: core
extends: null
todo: []
deps:
  - provides: [python3]
    python: ">=3.12"
    python_modules: [yaml, jsonschema]
    apt: python3
    dnf: python3
    pacman: python
  - provides: [git]
    probe: [git, --version]
    apt: git
    dnf: git
    pacman: git
  - provides: [devkit]
    probe: [devkit, --help]
    fix: "install devkit: clone https://github.com/williamsrb/dev-kit.git, then run ./bootstrap.sh --profile extract --apply and ./install.py --profile extract --headless --apply"
  - provides: [graft]
    optional: true
    probe: [graft, --version]
  - provides: [serena]
    optional: true
    probe: [serena, --version]
  - provides: [graphify]
    optional: true
    probe: [graphify, --help]
pipeline:
  - map.code
  - map.semantic
  - inventory.descriptors
  - inventory.controllers
  - inventory.templates
  - maps.normalize
  - inventory.integrations
  - inventory.runtime
  - inventory.baseline
  - maps.merge
  - rules.view
  - inventory.docs
  - product.impeccable
  - docs.synthesize
  - use_cases
  - domain.packet
  - spec.kit
  - report.compat
optional_slots:
  - domain.packet
  - inventory.baseline
  - report.compat
phases:
  - id: preflight
    title: Preflight
    command: doctor
  - id: context
    title: Context
    command: context
  - id: static
    title: Static inventory
    slots: [map.code, map.semantic, inventory.descriptors, inventory.controllers, inventory.templates, maps.normalize, inventory.integrations]
  - id: cms
    title: CMS
    slots: [inventory.runtime, inventory.baseline]
  - id: merge
    title: Merge
    slots: [maps.merge, rules.view, inventory.docs]
  - id: synthesis
    title: Synthesis
    slots: [product.impeccable, docs.synthesize, use_cases, domain.packet, spec.kit, report.compat]
  - id: agent
    title: Agent
    command: agent
  - id: check
    title: Check
    command: check
  - id: promote
    title: Promote
    command: promote
adapters:
  map.code: map.code
  map.semantic: map.semantic
  inventory.descriptors: null
  inventory.controllers: null
  inventory.templates: core.templates
  maps.normalize: maps.normalize
  inventory.integrations: null
  inventory.runtime: null
  inventory.baseline: null
  maps.merge: maps.merge
  rules.view: core.view_rules
  inventory.docs: null
  product.impeccable: product.impeccable
  docs.synthesize: docs.synthesize
  use_cases: use_cases
  domain.packet: null
  spec.kit: spec.kit
  report.compat: null
