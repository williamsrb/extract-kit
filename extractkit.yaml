# Kit identity. Profile types live under profiles/ as YAML.
name: Extract Kit
schema_versions: [1]

# Agent CLIs `extractkit headless` can start. Each entry is data:
#   argv            the command; the prompt always arrives on stdin
#   wrapper         optional: the argv[0] used instead of argv[0] when a devkit profile is selected
#                   (`--devkit-profile`); {profile} is the profile name, e.g. claude-{profile}
#   allowlist_args  appended unless agent.permissions is `bypass`
#   bypass_args     appended only when agent.permissions is `bypass`
#   allowed_tools   default tool allowlist for an agent task
#   preflight_tools default tool allowlist for the Serena and Graphify preflight
#   model_args      optional: appended when a model is set (--agent-model, EXTRACTKIT_AGENT_MODEL, agent.model
#                   or default_model); without it, a set model fails with agent_option_unsupported
#   effort_args     optional: the same for the effort (--agent-effort, agent.effort or default_effort)
#   default_model   optional: the model when nothing is set; unset means the CLI's own default
#   model_env       optional: the CLI's own model variable; headless compares the reported model with it
#                   when no model is set, and warns on a mismatch
#   default_effort  optional: the same for the effort
#   usage           optional: how to read tokens and cost from the agent's log
#   api_key_env     optional: the variable the CLI reads its credential from; headless fills it
#                   from an agent_api_key attachment or EXTRACTKIT_AGENT_API_KEY (see docs/headless.md)
#   conflicting_env optional: variables that outrank api_key_env, removed from the agent's environment
#   denied_tools    optional: tool patterns the agent may never use ({denied_tools}, comma-joined);
#                   here the flags that lift the kit's own guards
#   env_prefixes    optional: prefixes of the variables this CLI needs; the agent process gets those,
#                   a short base list (PATH, HOME, proxies, certificates) and `--agent-env`, nothing else
# Templates accept {allowed_tools} (comma-joined), {source}, {model} and {effort}. The model
# and effort args go before the permission args, which may end with the stdin `-`. Another
# CLI is a new entry here, with no code change. Argv verified 2026-10-09 against
# claude 2.1.284, codex-cli 0.151.0 and cursor-agent 2026.10.01 (`--help`,
# plus one stdin run of each in a scratch git folder).
agents:
  claude:
    wrapper: "claude-{profile}"
    argv: [claude, -p, --output-format, json]
    model_args: [--model, "{model}"]
    effort_args: [--effort, "{effort}"]
    model_env: ANTHROPIC_MODEL
    api_key_env: CLAUDE_CODE_OAUTH_TOKEN
    conflicting_env: [ANTHROPIC_API_KEY, ANTHROPIC_AUTH_TOKEN]
    env_prefixes: [ANTHROPIC_, CLAUDE_]
    denied_tools: ["Bash(extractkit * --force*)", "Bash(extractkit * --allow-production*)", "Bash(extractkit headless*)"]
    allowlist_args: [--permission-mode, acceptEdits, --allowedTools, "{allowed_tools}", --disallowedTools, "{denied_tools}"]
    bypass_args: [--permission-mode, bypassPermissions, --disallowedTools, "{denied_tools}"]
    allowed_tools: [Read, Write, Edit, Glob, Grep, "Bash(extractkit *)", mcp__serena]
    preflight_tools: [Read, Write, Edit, Glob, Grep, "Bash(graphify *)", mcp__serena]
    usage:
      tokens: [modelUsage.*.inputTokens, modelUsage.*.outputTokens, modelUsage.*.cacheCreationInputTokens, modelUsage.*.cacheReadInputTokens]
      cost_usd: total_cost_usd
      model: modelUsage
  codex:
    wrapper: "codex-{profile}"
    argv: [codex, exec, --cd, "{source}"]
    model_args: [--model, "{model}"]
    effort_args: [-c, "model_reasoning_effort={effort}"]
    api_key_env: OPENAI_API_KEY
    env_prefixes: [OPENAI_, CODEX_]
    allowlist_args: [--sandbox, workspace-write, "-"]
    bypass_args: [--dangerously-bypass-approvals-and-sandbox, "-"]
    allowed_tools: []
    preflight_tools: []
    usage:
      tokens_regex: 'tokens used\W+([\d,]+)'
  # cursor-agent has no per-tool allowlist flag, and in print mode it waits for
  # an approval that never comes unless --force is set. The allowlist route is
  # therefore its sandbox: --force with --sandbox enabled. Its `json` and
  # `stream-json` results carry no token or cost fields, so it has no usage: block.
  cursor:
    wrapper: "cursor-{profile}"
    argv: [cursor-agent, -p, --output-format, text, --trust, --approve-mcps]
    model_args: [--model, "{model}"]
    api_key_env: CURSOR_API_KEY
    env_prefixes: [CURSOR_]
    allowlist_args: [--force, --sandbox, enabled]
    bypass_args: [--force, --sandbox, disabled]
    allowed_tools: []
    preflight_tools: []
