_comment:
  - Operator override for the Authentic Scandinavia checkout. It is the profile that lived in
    the kit before extractkit worked out the project context itself, kept as the regression
    oracle. Composed over the enonic stack it reproduces tests/fixtures/live-config-before-o8.json.
  - Copy it to <source>/.extractkit/profile.yaml. An overlay sets only exclude and live_config.
  - site_url_keys / hostmap_keys / providers match the casefolded leaf of a config key.
  - env_endpoints rows pick an origin from a config value (origins, else default) and
    append every entry of urls. path scopes the row to config keys containing it.
  - exclude lists source folders outside every default-branch build (see the doctor build
    scope row). prototype ships from the prototype branch only; prototype-old from nothing.
exclude: [prototype, prototype-old]
live_config:
  site_url_keys: [tourplanurl]
  hostmap_keys: [env-hostmap, hostmap]
  providers:
    tourplan: Tourplan
    netaxept: Netaxept
    flywire: Flywire
    travelspecialist: TravelSpecialist
    hostmap: hostMap
  env_endpoints:
    - provider: Netaxept
      key: netaxeptEnv
      origins:
        test: https://test.epayment.nets.eu
      default: https://epayment.nets.eu
      urls:
        - /Netaxept/Register.aspx
        - /Netaxept/Process.aspx
        - /Netaxept/Query.aspx
        - /terminal/default.aspx
    - provider: Flywire
      key: env
      path: flywirePortal
      origins:
        demo: https://api-platform-sandbox.flywire.com
      default: https://api-platform.flywire.com
