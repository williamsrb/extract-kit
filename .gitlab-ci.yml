stages:
  - test
  - package

variables:
  DOCKER_TLS_CERTDIR: ""
  DOCKER_BUILDKIT: "1"
  DOCKERHUB_USER: leanon
  DOCKERHUB_REPO: leanon/extractkit-ci
  # The image installs devkit (99x-dev-kit) with its `extract` profile, from the
  # head of DEVKIT_REF at build time; the job prints the commit it got. A devkit
  # change alone does not start a build: run a pipeline on the docker branch
  # (CI/CD > Pipelines > Run pipeline). Fetching needs the
  # job token (CI_JOB_TOKEN), which works when 99x-dev-kit lists this project
  # under Settings > CI/CD > Job token permissions. If that is refused, the
  # masked variable CI_DEVKIT_TOKEN (read_repository on 99x-dev-kit) is used.
  DEVKIT_URL: https://git.seeds.no/williams/99x-dev-kit.git
  DEVKIT_REF: master
  PYYAML_VERSION: 6.0.2
  JSONSCHEMA_VERSION: 4.23.0
  RUFF_VERSION: 0.16.8
  PUSHRM_VERSION: v1.9.0
  PUSHRM_SHA256: 2f48649ce6c6aba1656a0fb3fc7a82971caf8ece7d86e6eed3d10c106d20fac8

# Unit tests and lint on every branch and merge request. The image build below
# only starts after this stage passes, so a broken kit is never pushed.
test:
  stage: test
  image: python:3.12-slim-bookworm
  tags:
    - docker
  rules:
    - if: $CI_COMMIT_BRANCH == "docker"
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git p7zip-full > /dev/null
    - pip install -q "pyyaml==${PYYAML_VERSION}" "jsonschema==${JSONSCHEMA_VERSION}" "ruff==${RUFF_VERSION}"
  script:
    - ruff check .
    - python3 -m unittest discover -s tests

# The kit is copied into the image at build time, so any change to the kit
# rebuilds it. Docs, tests, the README and docker/README.md alone do not.
.image-sources: &image-sources
  - .gitlab-ci.yml
  - docker/Dockerfile
  - docker/*.sh
  - extractkit
  - extractkit.yaml
  - extractkit_cli/**/*
  - steps/**/*
  - profiles/**/*
  - schemas/**/*
  - templates/**/*
  - headless/**/*
  - agent-tasks/**/*
  - skills/**/*

# Build, smoke-test, then push. Runs only on the docker branch.
docker-build:
  stage: package
  image: docker:29
  services:
    - docker:29-dind
  tags:
    - docker
  rules:
    - if: $CI_COMMIT_BRANCH == "docker"
      changes: *image-sources
  parallel:
    matrix:
      - TAG: latest
        RUN_AS: extract
      - TAG: root
        RUN_AS: root
  before_script:
    - apk add --no-cache git
    - git init -q .devkit
    - |
      fetch_devkit() {
        git -C .devkit fetch -q --depth 1 "$(printf '%s' "$DEVKIT_URL" | sed "s#^https://#https://gitlab-ci-token:${1}@#")" "$DEVKIT_REF"
      }
      fetch_devkit "$CI_JOB_TOKEN" 2>/dev/null \
        || { test -n "${CI_DEVKIT_TOKEN:-}" && fetch_devkit "$CI_DEVKIT_TOKEN"; } \
        || { echo "cannot fetch devkit: add this project to the job token allowlist of 99x-dev-kit, or set CI_DEVKIT_TOKEN" >&2; exit 1; }
    - git -C .devkit checkout -q FETCH_HEAD
    - git -C .devkit log -1 --format='devkit %H %s'
  script:
    - docker build -f docker/Dockerfile --build-context devkit=.devkit --build-arg RUN_AS="$RUN_AS" -t "$DOCKERHUB_REPO:$TAG" .
    - sh docker/smoke.sh "$DOCKERHUB_REPO:$TAG"
    - echo "$CI_DOCKER_TOKEN" | docker login --username "$DOCKERHUB_USER" --password-stdin
    - docker push "$DOCKERHUB_REPO:$TAG"

# The Docker Hub description comes from docker/README.md. It needs no Docker
# daemon: docker-pushrm talks to the Hub API with these credentials. Started
# by hand only, from a docker branch pipeline.
dockerhub-description:
  stage: package
  image: alpine:3.22
  tags:
    - docker
  rules:
    - if: $CI_COMMIT_BRANCH == "docker"
      when: manual
      allow_failure: true
  script:
    - wget -q -O /usr/local/bin/docker-pushrm "https://github.com/christian-korneck/docker-pushrm/releases/download/$PUSHRM_VERSION/docker-pushrm_linux_amd64"
    - echo "$PUSHRM_SHA256  /usr/local/bin/docker-pushrm" | sha256sum -c -
    - chmod +x /usr/local/bin/docker-pushrm
    - >
      DOCKER_USER="$DOCKERHUB_USER" DOCKER_PASS="$CI_DOCKER_TOKEN"
      docker-pushrm --file docker/README.md
      --short "Headless Extract Kit: read a legacy project and write its business rules and specs"
      "$DOCKERHUB_REPO"
